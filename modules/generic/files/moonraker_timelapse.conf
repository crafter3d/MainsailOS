
### moonraker-timelapse
### Provides frame capture and video rendering via moonraker-timelapse.
### Note: do NOT add [include timelapse.cfg] to printer.cfg — timelapse.cfg
### is loaded by the Python component automatically via symlink.
### Only add the include if you need slicer-triggered TIMELAPSE_TAKE_FRAME.

[update_manager timelapse]
type: git_repo
primary_branch: main
path: ~/moonraker-timelapse
origin: https://github.com/mainsail-crew/moonraker-timelapse.git
managed_services: klipper moonraker

[timelapse]
###   Directory where the generated video will be saved
output_path: ~/timelapse/
###   Directory where ffmpeg is installed
ffmpeg_binary_path: /usr/bin/ffmpeg
